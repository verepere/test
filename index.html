<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Raider Bucks$ - Home</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="home.css">
</head>

<body class="red-bg">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span class="raider">RAIDER</span>
            <span class="bucks">BUCKS$</span>
            <img src="images/image.png" alt="Raider Bucks Logo" width="60">
        </div>

        <!-- NAVIGATION -->
        <nav aria-label="Main navigation">

            <a href="index.html"
               class="active"
               aria-current="page">Home</a>

            <a href="balance.html">Balance</a>

            <a href="budget.html">Budget</a>

            <a href="map-page.html">Map</a>

        </nav>

        <div class="profile">
            <a href="settings.html"
               aria-label="Profile and settings">
                <svg class="profile-img" viewBox="0 0 40 40" aria-hidden="true">
                    <circle cx="20" cy="20" r="20" fill="#172033"/>
                    <circle cx="20" cy="15" r="6.5" fill="#fff"/>
                    <path d="M8 33c1.5-7 6-10 12-10s10.5 3 12 10A19 19 0 0 1 8 33z" fill="#fff"/>
                </svg>
            </a>
            <span>EN/PT</span>
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main class="container home-main">

        <h1 class="visually-hidden">Home</h1>

        <div class="home-grid">

            <!-- GREETING -->
            <section class="card" aria-labelledby="greeting-heading">
                <div class="card-header">
                    <h2 id="greeting-heading">Good Afternoon,</h2>
                </div>
                <div class="card-body">
                    <img class="avatar" src="images/PFP.png" alt="Profile avatar">
                    <p class="username">[Username]</p>
                </div>
            </section>

            <!-- TODAY'S BUDGET -->
            <section class="card" aria-labelledby="budget-heading">
                <div class="card-header">
                    <h2 id="budget-heading">Today’s budget is:</h2>
                </div>
                <div class="card-body">
                    <p class="big-amount">$200.00</p>
                </div>
            </section>

            <!-- FIND A PLACE TO SPEND -->
            <section class="card" aria-labelledby="map-heading">
                <div class="card-header">
                    <h2 id="map-heading">Find a place to spend!</h2>
                </div>
                <div class="card-body">
                    <a class="button" href="map-page.html">View Map</a>
                    <svg class="pinpoint" viewBox="0 0 24 32" aria-hidden="true">
                        <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#ae1026"/>
                        <circle cx="12" cy="12" r="5" fill="#fff"/>
                    </svg>
                </div>
            </section>

            <!-- CURRENT BALANCE -->
            <section class="card" aria-labelledby="balance-heading">
                <div class="card-header">
                    <h2 id="balance-heading">Your current balance is:</h2>
                </div>
                <div class="card-body">
                    <p class="big-amount">$1,500.00</p>
                </div>
            </section>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Raider Bucks$</p>
    </footer>

</body>
</html>
